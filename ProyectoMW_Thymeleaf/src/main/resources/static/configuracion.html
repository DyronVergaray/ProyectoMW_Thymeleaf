<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="vista/theme.css" rel="stylesheet">
</head>

<body class="d-flex flex-column vh-100">

    <!-- Menu de navegacion -->
    <header id="navbar-contenedor"></header>

    <div class="d-flex flex-nowrap flex-grow-1 overflow-hidden">

        <!-- Menu lateral -->
        <div id="sidebar-contenedor"></div>

        <!-- Area principal -->
        <main class="flex-grow-1 p-4 overflow-auto">

            <div class="card shadow-sm border-0 rounded-4 mx-auto" style="max-width: 700px;">
                <div class="card-body p-4">

                    <h4 class="fw-bold mb-4">Configuración de la Empresa</h4>


                    <!-- Campo de opciones remplazables -->
                    <div class="mb-3">
                        <p class="mb-1 fw-bold">Nombre de la empresa</p>
                        <div class="input-group">
                            <input type="text" class="form-control campo-editable" value="Empresa S.A.C." disabled>
                            <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-bold">RUC</p>
                        <div class="input-group">
                            <input type="text" class="form-control campo-editable" value="20123456789" disabled>
                            <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-bold">Correo de contacto</p>
                        <div class="input-group">
                            <input type="email" class="form-control campo-editable" value="contacto@empresa.com"
                                disabled>
                            <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-bold">Teléfono</p>
                        <div class="input-group">
                            <input type="text" class="form-control campo-editable" value="+51 999 888 777" disabled>
                            <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-bold">Dirección</p>
                        <div class="input-group">
                            <input type="text" class="form-control campo-editable" value="Av. Siempre Viva 123, Lima"
                                disabled>
                            <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-bold">Sitio web</p>
                        <div class="input-group">
                            <input type="url" class="form-control campo-editable" value="https://www.empresa.com"
                                disabled>
                            <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-bold">Rubro / Industria</p>
                        <div class="input-group">
                            <input type="text" class="form-control campo-editable" value="Tecnología" disabled>
                            <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-bold">Persona de contacto (RR.HH.)</p>
                        <div class="input-group">
                            <input type="text" class="form-control campo-editable" value="María López" disabled>
                            <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-bold">Descripción de la empresa</p>
                        <div class="input-group">
                            <input type="text" class="form-control campo-editable"
                                value="Empresa dedicada al desarrollo de software y soluciones tecnológicas." disabled>
                            <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <p class="mb-1 fw-bold">Contraseña</p>
                        <div class="input-group">
                            <input type="password" class="form-control campo-editable" value="••••••••" disabled>
                            <button class="btn btn-outline-primary btn-toggle" type="button">Cambiar</button>
                        </div>
                    </div>



                    <hr class="my-4">
                    <h6 class="fw-bold mb-3">Notificaciones</h6>

                    <!-- Campo de opciones con switches -->
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" role="switch" id="notiPostulantes" checked>
                        <label class="form-check-label" for="notiPostulantes">Nuevos postulantes</label>
                    </div>
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" role="switch" id="notiVencimiento" checked>
                        <label class="form-check-label" for="notiVencimiento">Vacantes por vencer</label>
                    </div>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" role="switch" id="notiMensajes">
                        <label class="form-check-label" for="notiMensajes">Mensajes de candidatos</label>
                    </div>

                    <!-- Boton para guardar los cambios -->
                    <button type="button" class="btn btn-custom-primary w-100 py-2 fw-medium">Guardar cambios</button>

                </div>
            </div>
        </main>

    </div>

    <script src="controlador/configuracion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="controlador/app.js"></script>
</body>

</html>
