<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Vacantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="vista/theme.css" rel="stylesheet">
</head>

<body class="d-flex flex-column vh-100">

    <!-- Menu de navegacion -->
    <header id="navbar-contenedor"></header>

    <div class="d-flex flex-nowrap flex-grow-1 overflow-hidden">
        
        <!-- Menu Lateral -->
        <div id="sidebar-contenedor"></div>


        <!-- Area Principal -->
        <main class="flex-grow-1 p-4 overflow-auto">

            <!-- Encabezado de Vacantes -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Mis Vacantes</h4>
                <a href="#" class="btn btn-custom-primary shadow-sm rounded-2">Publicar Vacante</a>
            </div>

            <!-- Tabla de vacantes -->
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr class="card-header-custom">
                                <th>Puesto</th>
                                <th>Postulantes</th>
                                <th>Publicada</th>
                                <th>Cierra</th>
                                <th>Estado</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>

                        <!-- Lista de vacantes -->
                        <tbody>
                            <tr>
                                <td>Programador Backend</td>
                                <td>18</td>
                                <td>10/08/2026</td>
                                <td>30/08/2026</td>

                                <!-- Estado de vacante -->
                                <td><span class="badge bg-success">Abierta</span></td>

                                <!-- Botones de edicion -->
                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-primary">Editar</button>
                                    <button type="button" class="btn btn-sm btn-outline-danger">Cerrar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Diseñador UX/UI</td>
                                <td>27</td>
                                <td>02/08/2026</td>
                                <td>22/08/2026</td>

                                <!-- Estado de vacante -->
                                <td><span class="badge bg-secondary">Cerrada</span></td>

                                <!-- Botones de edicion -->
                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-primary">Editar</button>
                                    <button type="button" class="btn btn-sm btn-outline-success">Reabrir</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Analista de Datos</td>
                                <td>9</td>
                                <td>18/08/2026</td>
                                <td>10/09/2026</td>

                                <!-- Estado de vacante -->
                                <td><span class="badge bg-success">Abierta</span></td>

                                <!-- Botones de edicion -->
                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-primary">Editar</button>
                                    <button type="button" class="btn btn-sm btn-outline-danger">Cerrar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Community Manager</td>
                                <td>34</td>
                                <td>25/07/2026</td>
                                <td>20/08/2026</td>

                                <!-- Estado de vacante -->
                                <td><span class="badge bg-warning text-dark">Por vencer</span></td>

                                <!-- Botones de edicion -->
                                <td class="text-end">
                                    <button type="button" class="btn btn-sm btn-outline-primary">Editar</button>
                                    <button type="button" class="btn btn-sm btn-outline-danger">Cerrar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="controlador/app.js"></script>
</body>

</html>
